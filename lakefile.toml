name = "lean-decal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanDecal", "LectureSlides"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "verso-slides"
scope = "leanprover"

[[lean_lib]]
name = "LeanDecal"

[[lean_exe]]
name = "slides"
root = "LectureSlides"
